name: PR Checks

on:
  pull_request:
    branches:
      - main
      - hardening/fail-closed-api-auth
  push:
    branches:
      - hardening/fail-closed-api-auth
      - feature/public-signals-api

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile critical API modules
        run: |
          python -m py_compile apps/api/auth.py
          python -m py_compile apps/api/main.py
          if [ -f apps/api/routes/public.py ]; then
            python -m py_compile apps/api/routes/public.py
          fi

      - name: Run API security tests
        run: python -m pytest -q tests/test_api_security.py

      - name: Run public signals tests when present
        run: |
          if [ -f tests/test_public_signals.py ]; then
            python -m pytest -q tests/test_public_signals.py
          else
            echo "tests/test_public_signals.py not present on this branch; skipping."
          fi
